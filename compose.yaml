services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: moneyfy
      POSTGRES_USER: moneyfy
      POSTGRES_PASSWORD: ${MONEYFY_POSTGRES_PASSWORD:?Set MONEYFY_POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moneyfy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyfy -d moneyfy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  moneyfy_postgres:
